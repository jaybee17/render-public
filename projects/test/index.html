<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" /><title>Test card</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#000;font-family:Arial,sans-serif;color:#F6EEDB}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0A0907}
#t{position:absolute;left:160px;top:380px;font-size:120px;font-weight:900}#s{position:absolute;left:160px;top:560px;font-size:56px;color:#D6A63A}</style></head><body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="6">
<div id="t">RENDER TEST</div><div id="s">public repo, nothing private</div></div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.from('#t',{opacity:0,y:-40,duration:1,ease:'power2.out'},0.2);
tl.from('#s',{opacity:0,y:30,duration:1,ease:'power2.out'},0.8);
tl.to('#t',{x:20,duration:5,ease:'none'},0.2);
window.__timelines['main'] = tl;
</script></body></html>
